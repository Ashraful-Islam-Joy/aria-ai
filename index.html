<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aria - AI Companion</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0f0a15;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .chat-card {
            width: 100%;
            max-width: 420px;
            height: 650px;
            background: linear-gradient(180deg, #1d132b 0%, #110b1a 100%);
            border-radius: 28px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        /* Header */
        .header {
            padding: 18px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(255, 255, 255, 0.03);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .profile-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .avatar {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background: linear-gradient(135deg, #ff758c 0%, #ff7eb3 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            position: relative;
            box-shadow: 0 4px 12px rgba(255, 117, 140, 0.4);
        }

        .status-dot {
            width: 10px;
            height: 10px;
            background-color: #ff4757;
            border: 2px solid #1d132b;
            border-radius: 50%;
            position: absolute;
            bottom: 0;
            right: 0;
            transition: background-color 0.3s;
        }

        .status-dot.active {
            background-color: #2ed573;
        }

        .user-details h3 {
            font-size: 18px;
            font-weight: 600;
        }

        .user-details p {
            font-size: 13px;
            color: #a09cb0;
        }

        .voice-btn {
            background: #00a8ff;
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(0, 168, 255, 0.3);
        }

        /* Chat Body */
        .chat-body {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            scroll-behavior: smooth;
        }

        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 18px;
            font-size: 14px;
            line-height: 1.4;
            word-wrap: break-word;
        }

        .message.user {
            align-self: flex-end;
            background: linear-gradient(135deg, #ff416c 0%, #ff4b2b 100%);
            color: white;
            border-bottom-right-radius: 4px;
        }

        .message.bot {
            align-self: flex-start;
            background: rgba(255, 255, 255, 0.08);
            color: #e1e1e1;
            border-bottom-left-radius: 4px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        /* Input Area */
        .input-container {
            padding: 15px 20px;
            background: rgba(0, 0, 0, 0.2);
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }

        .input-box {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 71, 87, 0.4);
            border-radius: 25px;
            padding: 5px 8px 5px 18px;
        }

        .input-box input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: white;
            font-size: 14px;
        }

        .input-box input::placeholder {
            color: #7a7585;
        }

        .send-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #ff4757;
            border: none;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.2s, background 0.2s;
        }

        .send-btn:hover {
            transform: scale(1.05);
            background: #ff6b81;
        }

        .footer-text {
            text-align: center;
            font-size: 11px;
            color: #6a6575;
            margin-top: 10px;
            letter-spacing: 1px;
        }

        .footer-text span {
            color: #00a8ff;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div class="chat-card">
        <!-- Header -->
        <div class="header">
            <div class="profile-info">
                <div class="avatar">
                    🦋
                    <div class="status-dot" id="statusDot"></div>
                </div>
                <div class="user-details">
                    <h3>Aria</h3>
                    <p>AI Companion • <span id="statusText">Connecting... 🦋</span></p>
                </div>
            </div>
            <button class="voice-btn">🔊 Voice On</button>
        </div>

        <!-- Chat Area -->
        <div class="chat-body" id="chatBody">
            <div class="message bot">
                Hey there! I'm Aria ❤️ How are you feeling today?
            </div>
        </div>

        <!-- Input Area -->
        <div class="input-container">
            <div class="input-box">
                <input type="text" id="messageInput" placeholder="Say something sweet..." autocomplete="off">
                <button class="send-btn" id="sendBtn">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="22" y1="2" x2="11" y2="13"></line>
                        <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                    </svg>
                </button>
            </div>
            <div class="footer-text">
                CRAFTED WITH ❤️ BY <span>ASHRAFUL</span>
            </div>
        </div>
    </div>

    <script>
        const messageInput = document.getElementById('messageInput');
        const sendBtn = document.getElementById('sendBtn');
        const chatBody = document.getElementById('chatBody');
        const statusText = document.getElementById('statusText');
        const statusDot = document.getElementById('statusDot');

        // Dynamically detect Protocol (ws:// or wss://)
        const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        const wsUrl = `${protocol}//${window.location.host}/ws/chat`;

        let socket;

        function connectWebSocket() {
            socket = new WebSocket(wsUrl);

            socket.onopen = function () {
                console.log("WebSocket connected successfully!");
                statusText.innerText = "Active Now 🦋";
                statusDot.classList.add('active');
            };

            socket.onmessage = function (event) {
                appendMessage(event.data, 'bot');
            };

            socket.onclose = function () {
                console.log("WebSocket disconnected. Retrying in 3 seconds...");
                statusText.innerText = "Connecting... 🦋";
                statusDot.classList.remove('active');
                setTimeout(connectWebSocket, 3000); // Auto reconnect
            };

            socket.onerror = function (err) {
                console.error("WebSocket Error: ", err);
            };
        }

        // Initialize Connection
        connectWebSocket();

        function sendMessage() {
            const text = messageInput.value.trim();
            if (text === "") return;

            if (socket && socket.readyState === WebSocket.OPEN) {
                appendMessage(text, 'user');
                socket.send(text);
                messageInput.value = "";
            } else {
                alert("Server connection is not ready yet! Please wait a moment...");
            }
        }

        function appendMessage(text, sender) {
            const msgDiv = document.createElement('div');
            msgDiv.classList.add('message', sender);
            msgDiv.innerText = text;
            chatBody.appendChild(msgDiv);
            chatBody.scrollTop = chatBody.scrollHeight; // Auto scroll to bottom
        }

        // Event Listeners
        sendBtn.addEventListener('click', sendMessage);

        messageInput.addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                sendMessage();
            }
        });
    </script>

</body>
</html>
