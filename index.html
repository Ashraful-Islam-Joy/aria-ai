<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aria - AI Companion</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0f0a15; color: #ffffff; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .chat-card { width: 100%; max-width: 420px; height: 680px; background: linear-gradient(180deg, #1d132b 0%, #110b1a 100%); border-radius: 28px; border: 1px solid rgba(255, 255, 255, 0.1); box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6); display: flex; flex-direction: column; overflow: hidden; position: relative; }
        
        .header { padding: 18px 20px; display: flex; align-items: center; justify-content: space-between; background: rgba(255, 255, 255, 0.03); border-bottom: 1px solid rgba(255, 255, 255, 0.05); }
        .profile-info { display: flex; align-items: center; gap: 12px; }
        .avatar { width: 45px; height: 45px; border-radius: 50%; background: linear-gradient(135deg, #ff758c 0%, #ff7eb3 100%); display: flex; align-items: center; justify-content: center; font-size: 22px; position: relative; box-shadow: 0 4px 12px rgba(255, 117, 140, 0.4); }
        .status-dot { width: 10px; height: 10px; background-color: #ff4757; border: 2px solid #1d132b; border-radius: 50%; position: absolute; bottom: 0; right: 0; transition: background-color 0.3s; }
        .status-dot.active { background-color: #2ed573; }
        .user-details h3 { font-size: 18px; font-weight: 600; }
        .user-details p { font-size: 13px; color: #a09cb0; }
        .voice-btn { background: #00a8ff; color: white; border: none; padding: 8px 14px; border-radius: 20px; font-size: 12px; font-weight: 600; cursor: pointer; box-shadow: 0 4px 12px rgba(0, 168, 255, 0.3); transition: 0.2s; }
        .voice-btn.off { background: #57606f; box-shadow: none; }

        .chat-body { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; scroll-behavior: smooth; }
        .message-wrapper { display: flex; flex-direction: column; max-width: 80%; }
        .message-wrapper.user { align-self: flex-end; align-items: flex-end; }
        .message-wrapper.bot { align-self: flex-start; align-items: flex-start; }
        .message { padding: 12px 16px; border-radius: 18px; font-size: 14px; line-height: 1.4; word-wrap: break-word; }
        .message-wrapper.user .message { background: linear-gradient(135deg, #ff416c 0%, #ff4b2b 100%); color: white; border-bottom-right-radius: 4px; }
        .message-wrapper.bot .message { background: rgba(255, 255, 255, 0.08); color: #e1e1e1; border-bottom-left-radius: 4px; border: 1px solid rgba(255, 255, 255, 0.05); }
        .meta-info { font-size: 10px; color: #8a8599; margin-top: 4px; padding: 0 4px; }

        .typing-indicator { display: flex; align-items: center; gap: 4px; padding: 12px 16px; background: rgba(255, 255, 255, 0.08); border-radius: 18px; border-bottom-left-radius: 4px; width: fit-content; }
        .typing-dot { width: 6px; height: 6px; background: #ff7eb3; border-radius: 50%; animation: bounce 1.4s infinite ease-in-out both; }
        .typing-dot:nth-child(1) { animation-delay: -0.32s; }
        .typing-dot:nth-child(2) { animation-delay: -0.16s; }
        @keyframes bounce { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1.0); } }

        .input-container { padding: 15px 20px; background: rgba(0, 0, 0, 0.2); border-top: 1px solid rgba(255, 255, 255, 0.05); }
        .input-box { display: flex; align-items: center; gap: 10px; background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 71, 87, 0.4); border-radius: 25px; padding: 5px 8px 5px 18px; }
        .input-box input { flex: 1; background: transparent; border: none; outline: none; color: white; font-size: 14px; }
        .input-box input::placeholder { color: #7a7585; }
        .send-btn { width: 40px; height: 40px; border-radius: 50%; background: #ff4757; border: none; color: white; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: transform 0.2s, background 0.2s; }
        .send-btn:hover { transform: scale(1.05); background: #ff6b81; }
        .footer-text { text-align: center; font-size: 11px; color: #6a6575; margin-top: 10px; letter-spacing: 1px; }
        .footer-text span { color: #00a8ff; font-weight: 600; }
    </style>
</head>
<body>

    <div class="chat-card">
        <div class="header">
            <div class="profile-info">
                <div class="avatar">
                    🦋
                    <div class="status-dot" id="statusDot"></div>
                </div>
                <div class="user-details">
                    <h3>Aria</h3>
                    <p>AI Companion • <span id="statusText">Connecting... 🦋</span></p>
                </div>
            </div>
            <button class="voice-btn" id="voiceToggle">🔊 Voice On</button>
        </div>

        <div class="chat-body" id="chatBody">
            <div class="message-wrapper bot">
                <div class="message">Hey there! I'm Aria ❤️ How are you feeling today?</div>
                <div class="meta-info" id="initialTime"></div>
            </div>
        </div>

        <div class="input-container">
            <div class="input-box">
                <input type="text" id="messageInput" placeholder="Say something in Bangla, English, or Hindi..." autocomplete="off">
                <button class="send-btn" id="sendBtn">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="22" y1="2" x2="11" y2="13"></line>
                        <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                    </svg>
                </button>
            </div>
            <div class="footer-text">CRAFTED WITH ❤️ BY <span>ASHRAFUL</span></div>
        </div>
    </div>

    <script>
        const messageInput = document.getElementById('messageInput');
        const sendBtn = document.getElementById('sendBtn');
        const chatBody = document.getElementById('chatBody');
        const statusText = document.getElementById('statusText');
        const statusDot = document.getElementById('statusDot');
        const voiceToggle = document.getElementById('voiceToggle');

        let isVoiceEnabled = true;
        let typingIndicatorEl = null;
        let currentAudio = null;

        document.getElementById('initialTime').innerText = getCurrentTime();

        voiceToggle.addEventListener('click', () => {
            isVoiceEnabled = !isVoiceEnabled;
            if (isVoiceEnabled) {
                voiceToggle.innerText = "🔊 Voice On";
                voiceToggle.classList.remove('off');
            } else {
                voiceToggle.innerText = "🔇 Voice Off";
                voiceToggle.classList.add('off');
                if (currentAudio) currentAudio.pause();
            }
        });

        const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        const wsUrl = `${protocol}//${window.location.host}/ws/chat`;
        let socket;

        function connectWebSocket() {
            socket = new WebSocket(wsUrl);

            socket.onopen = function () {
                statusText.innerText = "Active Now 🦋";
                statusDot.classList.add('active');
            };

            socket.onmessage = function (event) {
                removeTypingIndicator();
                updateUserSeenStatus();

                try {
                    const data = JSON.parse(event.data);
                    appendMessage(data.text, 'bot');

                    if (isVoiceEnabled && data.audio) {
                        playAudioResponse(data.audio);
                    }
                } catch (e) {
                    appendMessage(event.data, 'bot');
                }
            };

            socket.onclose = function () {
                statusText.innerText = "Connecting... 🦋";
                statusDot.classList.remove('active');
                setTimeout(connectWebSocket, 3000);
            };
        }

        connectWebSocket();

        function sendMessage() {
            const text = messageInput.value.trim();
            if (text === "") return;

            if (socket && socket.readyState === WebSocket.OPEN) {
                appendMessage(text, 'user');
                socket.send(text);
                messageInput.value = "";
                showTypingIndicator();
                
                if (currentAudio) {
                    currentAudio.pause();
                }
            } else {
                alert("Connection is not ready yet!");
            }
        }

        function appendMessage(text, sender) {
            const wrapper = document.createElement('div');
            wrapper.classList.add('message-wrapper', sender);
            const msgDiv = document.createElement('div');
            msgDiv.classList.add('message');
            msgDiv.innerText = text;
            const metaDiv = document.createElement('div');
            metaDiv.classList.add('meta-info');
            metaDiv.innerText = getCurrentTime() + (sender === 'user' ? ' • Delivered' : '');

            wrapper.appendChild(msgDiv);
            wrapper.appendChild(metaDiv);
            chatBody.appendChild(wrapper);
            chatBody.scrollTop = chatBody.scrollHeight;
        }

        function showTypingIndicator() {
            if (typingIndicatorEl) return;
            typingIndicatorEl = document.createElement('div');
            typingIndicatorEl.classList.add('message-wrapper', 'bot');
            typingIndicatorEl.id = 'typingIndicatorWrapper';
            typingIndicatorEl.innerHTML = `<div class="typing-indicator"><div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div></div>`;
            chatBody.appendChild(typingIndicatorEl);
            chatBody.scrollTop = chatBody.scrollHeight;
        }

        function removeTypingIndicator() {
            if (typingIndicatorEl) {
                typingIndicatorEl.remove();
                typingIndicatorEl = null;
            }
        }

        function updateUserSeenStatus() {
            const userMetas = chatBody.querySelectorAll('.message-wrapper.user .meta-info');
            if (userMetas.length > 0) {
                const lastMeta = userMetas[userMetas.length - 1];
                const timeOnly = lastMeta.innerText.split(' • ')[0];
                lastMeta.innerText = `${timeOnly} • Seen ✓`;
            }
        }

        function getCurrentTime() {
            const now = new Date();
            let hours = now.getHours();
            let minutes = now.getMinutes();
            const ampm = hours >= 12 ? 'PM' : 'AM';
            hours = hours % 12;
            hours = hours ? hours : 12;
            minutes = minutes < 10 ? '0' + minutes : minutes;
            return `${hours}:${minutes} ${ampm}`;
        }

        function playAudioResponse(audioBase64) {
            if (currentAudio) {
                currentAudio.pause();
            }
            currentAudio = new Audio("data:audio/mp3;base64," + audioBase64);
            currentAudio.play();
        }

        sendBtn.addEventListener('click', sendMessage);
        messageInput.addEventListener('keypress', function (e) {
            if (e.key === 'Enter') { e.preventDefault(); sendMessage(); }
        });
    </script>
</body>
</html>
