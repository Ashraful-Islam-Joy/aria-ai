<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-content">
    <title>Aria - AI Companion</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #0d0714;
            position: fixed;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* --- Ambient Particles --- */
        .ambient-bg {
            position: absolute;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 1;
            pointer-events: none;
        }

        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.5;
            animation: floatOrb 8s infinite alternate ease-in-out;
        }

        .orb-1 { width: 320px; height: 320px; background: radial-gradient(circle, #ff2a70, transparent); top: 10%; left: 10%; animation-duration: 9s; }
        .orb-2 { width: 380px; height: 380px; background: radial-gradient(circle, #00d2ff, transparent); bottom: 10%; right: 10%; animation-duration: 11s; }
        .orb-3 { width: 250px; height: 250px; background: radial-gradient(circle, #9b51e0, transparent); top: 40%; right: 25%; animation-duration: 7s; }
        .orb-4 { width: 280px; height: 280px; background: radial-gradient(circle, #ff758c, transparent); bottom: 30%; left: 20%; animation-duration: 10s; }

        @keyframes floatOrb {
            0% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(40px, -30px) scale(1.15); }
            100% { transform: translate(-30px, 40px) scale(0.9); }
        }

        /* --- Intro Screen --- */
        #intro-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(13, 7, 20, 0.85);
            backdrop-filter: blur(20px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.8s ease, visibility 0.8s ease;
        }

        .loader-content {
            position: relative;
            width: 110px;
            height: 110px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 22px;
        }

        .intro-avatar {
            font-size: 45px;
            animation: pulse 2s infinite ease-in-out;
            filter: drop-shadow(0 0 10px rgba(0, 210, 255, 0.6));
        }

        .glowing-ring {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 3px solid transparent;
            border-top-color: #00d2ff;
            border-right-color: #ff2a70;
            border-bottom-color: #ff758c;
            animation: spin 1.4s linear infinite;
            box-shadow: 0 0 25px rgba(0, 210, 255, 0.5);
        }

        .intro-title {
            color: #fff;
            font-size: 34px;
            font-weight: 800;
            letter-spacing: 6px;
            margin-bottom: 8px;
            background: linear-gradient(135deg, #ffffff, #ff758c, #00d2ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 20px rgba(255, 117, 140, 0.3);
        }

        .intro-subtitle {
            color: rgba(255, 255, 255, 0.75);
            font-size: 13.5px;
            letter-spacing: 1px;
            font-weight: 400;
        }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        @keyframes pulse { 0%, 100% { transform: scale(0.92); opacity: 0.85; } 50% { transform: scale(1.12); opacity: 1; } }

        #intro-screen.fade-out {
            opacity: 0;
            visibility: hidden;
        }

        /* --- Chat Card --- */
        .chat-card {
            position: relative;
            z-index: 10;
            width: 420px;
            max-width: 100%;
            height: 680px;
            max-height: 100%;
            background: rgba(26, 15, 29, 0.85);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 28px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.7);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            opacity: 0;
            transform: translateY(30px) scale(0.95);
            transition: opacity 0.8s ease, transform 0.8s ease;
        }

        @media (max-width: 480px) {
            .chat-card {
                width: 100%;
                height: 100%;
                border-radius: 0;
                border: none;
            }
        }

        .chat-card.visible {
            opacity: 1;
            transform: translateY(0) scale(1);
        }

        /* --- Header Section --- */
        .chat-header {
            padding: 14px 18px;
            display: flex;
            align-items: center;
            gap: 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            background: rgba(255, 255, 255, 0.02);
            flex-shrink: 0;
        }

        .avatar-container {
            position: relative;
            width: 44px;
            height: 44px;
        }

        .avatar {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: linear-gradient(135deg, #ff758c, #ff7eb3);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            box-shadow: 0 0 15px rgba(255, 117, 140, 0.4);
        }

        .status-dot {
            position: absolute;
            bottom: 2px;
            right: 2px;
            width: 11px;
            height: 11px;
            background-color: #00d2ff !important;
            border: 2px solid #1a101d;
            border-radius: 50%;
            box-shadow: 0 0 8px rgba(0, 210, 255, 0.7) !important;
        }

        .header-info h2 {
            color: #ffffff;
            font-size: 16px;
            font-weight: 600;
        }

        .header-info p {
            color: rgba(255, 255, 255, 0.6);
            font-size: 12px;
        }

        .status-text-highlight {
            color: rgba(255, 255, 255, 0.85);
            font-weight: 500;
        }

        /* --- Messages Section --- */
        .chat-messages {
            flex: 1;
            padding: 16px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .message-wrapper {
            display: flex;
            flex-direction: column;
            max-width: 82%;
        }

        .message-wrapper.user {
            align-self: flex-end;
            align-items: flex-end;
        }

        .message-wrapper.aria {
            align-self: flex-start;
            align-items: flex-start;
        }

        .message {
            padding: 12px 16px;
            border-radius: 20px;
            font-size: 14px;
            line-height: 1.45;
            word-wrap: break-word;
        }

        .aria-msg {
            background: rgba(255, 255, 255, 0.08);
            color: rgba(255, 255, 255, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-top-left-radius: 4px;
        }

        .user-msg {
            background: linear-gradient(135deg, #ff2a70, #ff4e50);
            color: #ffffff;
            border-top-right-radius: 4px;
            box-shadow: 0 4px 15px rgba(255, 42, 112, 0.3);
        }

        .seen-status {
            font-size: 10px;
            color: rgba(255, 255, 255, 0.45);
            margin-top: 3px;
            margin-right: 4px;
            font-weight: 500;
        }

        .typing-indicator {
            display: flex;
            align-items: center;
            gap: 5px;
            padding: 12px 16px;
        }

        .typing-dot {
            width: 7px;
            height: 7px;
            background-color: rgba(255, 255, 255, 0.7);
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out both;
        }

        .typing-dot:nth-child(1) { animation-delay: -0.32s; }
        .typing-dot:nth-child(2) { animation-delay: -0.16s; }

        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }

        /* --- Footer Section --- */
        .chat-footer-container {
            display: flex;
            flex-direction: column;
            background: rgba(0, 0, 0, 0.4);
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            flex-shrink: 0;
        }

        .chat-footer {
            padding: 10px 14px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .input-wrapper {
            flex: 1;
        }

        .chat-input {
            width: 100%;
            padding: 12px 18px;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 105, 180, 0.25);
            border-radius: 30px;
            color: #fff;
            font-size: 14px;
            outline: none;
            transition: all 0.3s ease;
        }

        .chat-input:focus {
            border-color: #ff4e50;
            box-shadow: 0 0 12px rgba(255, 78, 80, 0.3);
        }

        .send-btn {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: linear-gradient(135deg, #ff4e50, #ff758c);
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 12px rgba(255, 78, 80, 0.4);
            flex-shrink: 0;
        }

        .send-btn svg {
            width: 18px;
            height: 18px;
            fill: #fff;
        }

        /* Fixed Developer Credit Below Input */
        .developer-credit-inline {
            padding-bottom: 6px;
            text-align: center;
            font-size: 10.5px;
            color: rgba(255, 255, 255, 0.45);
            letter-spacing: 1.2px;
            font-weight: 400;
            text-transform: uppercase;
        }

        .developer-credit-inline span {
            color: #00d2ff;
            font-weight: 600;
            text-shadow: 0 0 6px rgba(0, 210, 255, 0.6);
        }
    </style>
</head>
<body>

    <div class="ambient-bg">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
        <div class="orb orb-4"></div>
    </div>

    <div id="intro-screen">
        <div class="loader-content">
            <div class="glowing-ring"></div>
            <div class="intro-avatar">🦋</div>
        </div>
        <h1 class="intro-title">ARIA</h1>
        <p class="intro-subtitle">Waking up just for you... 🦋</p>
    </div>

    <div class="chat-card">
        <div class="chat-header">
            <div class="avatar-container">
                <div class="avatar">🦋</div>
                <div class="status-dot"></div>
            </div>
            <div class="header-info">
                <h2>Aria</h2>
                <p id="headerStatus">AI Companion • <span class="status-text-highlight" id="statusText">Connecting...</span> 🦋</p>
            </div>
        </div>

        <div class="chat-messages" id="chatBox">
            <div class="message-wrapper aria">
                <div class="message aria-msg">
                    Hey Sweetheart ❤️! I am here for you to listen.
                </div>
            </div>
        </div>

        <div class="chat-footer-container">
            <div class="chat-footer">
                <div class="input-wrapper">
                    <input type="text" id="userInput" class="chat-input" placeholder="Type a message..." onkeypress="handleKeyPress(event)">
                </div>
                <button class="send-btn" onclick="sendMessage()">
                    <svg viewBox="0 0 24 24">
                        <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
                    </svg>
                </button>
            </div>
            <div class="developer-credit-inline">
                Crafted with ❤️ by <span>Ashraful</span>
            </div>
        </div>
    </div>

    <script>
        // Intro Animation
        window.addEventListener("load", () => {
            setTimeout(() => {
                const intro = document.getElementById("intro-screen");
                const chatCard = document.querySelector(".chat-card");

                intro.classList.add("fade-out");
                setTimeout(() => { chatCard.classList.add("visible"); }, 300);
            }, 2000); 
        });

        // Responsive Viewport Resize
        if (window.visualViewport) {
            function updateViewport() {
                document.body.style.height = window.visualViewport.height + "px";
                scrollToBottom();
            }
            window.visualViewport.addEventListener("resize", updateViewport);
            window.visualViewport.addEventListener("scroll", updateViewport);
            updateViewport();
        }

        // Robust WebSocket Manager with Auto-Reconnect
        const wsUrl = "wss://aria-ai-eklr.onrender.com/ws/chat";
        let ws = null;
        const chatBox = document.getElementById("chatBox");
        const userInput = document.getElementById("userInput");
        const statusText = document.getElementById("statusText");
        let typingElement = null;

        function connectWebSocket() {
            statusText.innerText = "Connecting...";
            ws = new WebSocket(wsUrl);

            ws.onopen = function() {
                statusText.innerText = "Active Now";
            };

            ws.onmessage = function(event) {
                removeTypingIndicator();
                markLastMessageSeen();
                appendAriaMessage(event.data);
            };

            ws.onerror = function() {
                statusText.innerText = "Connecting...";
            };

            ws.onclose = function() {
                statusText.innerText = "Reconnecting...";
                setTimeout(connectWebSocket, 3000); // Auto reconnect after 3s
            };
        }

        connectWebSocket();

        userInput.addEventListener("focus", () => {
            setTimeout(scrollToBottom, 300);
        });

        function sendMessage() {
            const message = userInput.value.trim();
            if (message === "") return;

            // Check if WebSocket is OPEN
            if (!ws || ws.readyState !== WebSocket.OPEN) {
                alert("Connection is still initializing. Please wait a second!");
                return;
            }

            appendUserMessage(message);
            ws.send(message);
                userInput.value = "";
            showTypingIndicator();
        }

        function handleKeyPress(event) {
            if (event.key === "Enter") {
                sendMessage();
            }
        }

        function appendUserMessage(text) {
            document.querySelectorAll('.seen-status').forEach(e => e.remove());

            const wrapper = document.createElement("div");
            wrapper.classList.add("message-wrapper", "user");
            wrapper.innerHTML = `<div class="message user-msg">${escapeHtml(text)}</div>`;
            
            chatBox.appendChild(wrapper);
            scrollToBottom();
        }

        function markLastMessageSeen() {
            const lastUserMsg = chatBox.querySelector(".message-wrapper.user:last-of-type");
            if (lastUserMsg && !lastUserMsg.querySelector('.seen-status')) {
                const seenDiv = document.createElement("div");
                seenDiv.classList.add("seen-status");
                seenDiv.innerText = "Seen ✓";
                lastUserMsg.appendChild(seenDiv);
            }
        }

        function appendAriaMessage(text) {
            const wrapper = document.createElement("div");
            wrapper.classList.add("message-wrapper", "aria");
            wrapper.innerHTML = `<div class="message aria-msg">${escapeHtml(text)}</div>`;
            
            chatBox.appendChild(wrapper);
            scrollToBottom();
        }

        function showTypingIndicator() {
            if (typingElement) return;

            typingElement = document.createElement("div");
            typingElement.classList.add("message-wrapper", "aria");
            typingElement.id = "typingBubble";
            typingElement.innerHTML = `
                <div class="message aria-msg typing-indicator">
                    <div class="typing-dot"></div>
                    <div class="typing-dot"></div>
                    <div class="typing-dot"></div>
                </div>
            `;
            chatBox.appendChild(typingElement);
            scrollToBottom();
        }

        function removeTypingIndicator() {
            if (typingElement) {
                typingElement.remove();
                typingElement = null;
            }
        }

        function scrollToBottom() {
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }
    </script>
</body>
</html>
